# Production overrides. Every connection/secret value stays sourced from environment variables
# via the base application.properties - this profile only tightens what's safe to expose in a
# live environment: no SQL/debug logging, no Swagger/API docs, no devtools live-reload.

spring.jpa.show-sql=false

logging.level.com.smartfinance.backend=INFO
logging.level.org.hibernate.SQL=WARN

# Swagger/API docs are a local-dev convenience only; keep them off in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Defensive: spring-boot-devtools already disables itself when run from a packaged jar, but this
# makes the intent explicit regardless of how the app is launched.
spring.devtools.restart.enabled=false
