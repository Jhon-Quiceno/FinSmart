spring.application.name=smart-finance-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Cloud Run (and most container platforms) inject PORT and require the app to listen on it
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT_EXTERNAL}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Mail is optional and degrades gracefully when unconfigured (see EmailNotificationSender);
# the auto-configured mail health check doesn't know that, so it's excluded from /actuator/health.
management.health.mail.enabled=false

# Swagger / OpenAPI (springdoc 3.x)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
app.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME}
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE}
app.jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# AI providers (Sprint 5) - app-operator-configured via environment variables, not per-user.
# A provider is enabled only when its api-key has a value. AI_PROVIDER_PRIORITY is an optional
# comma-separated list (relaxed-bound into List<String>); if unset or empty after filtering,
# AiProviderRegistry falls back to the catalog default order: NVIDIA -> OpenCode -> OpenRouter.
app.ai.priority=${AI_PROVIDER_PRIORITY:}
app.ai.providers.nvidia.api-key=${NVIDIA_API_KEY:}
app.ai.providers.nvidia.model=${NVIDIA_MODEL:}
app.ai.providers.opencode.api-key=${OPENCODE_API_KEY:}
app.ai.providers.opencode.model=${OPENCODE_MODEL:}
app.ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.providers.openrouter.model=${OPENROUTER_MODEL:}

# Per-user AI chat quota: max USER-role messages allowed per UTC calendar month, enforced by
# AiChatService before contacting any provider (protects the free-tier provider quotas above).
app.ai.monthly-message-limit=${AI_MONTHLY_MESSAGE_LIMIT:5}

# Basic in-memory rate limiting (Sprint 1) - RateLimitFilter, one fixed window per key
# (IP for login/register, IP+userId for ai-chat). Not distributed: see docs/sprints/sprint1.md,
# architecture decision 4.
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX_REQUESTS:3}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:300}
app.rate-limit.ai-chat.max-requests=${RATE_LIMIT_AI_CHAT_MAX_REQUESTS:10}
app.rate-limit.ai-chat.window-seconds=${RATE_LIMIT_AI_CHAT_WINDOW_SECONDS:60}

# Email (Resend SMTP) - Sprint 5 notifications; optional and degradable: if RESEND_API_KEY
# is not set, EmailNotificationSender logs at INFO and skips sending, and the
# app keeps working with in-app-only notifications. "resend" is Resend's fixed SMTP
# username (not a secret); the API key is the password.
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Native scheduled automations (Sprint 5, Batch 3) - replace the original n8n workflows.
# app.jobs.enabled is the master switch: set to false to disable @EnableScheduling entirely
# (e.g. in local runs or tests that don't need background jobs firing).
app.jobs.enabled=${APP_JOBS_ENABLED:true}
app.jobs.payment-reminder.cron=${APP_JOBS_PAYMENT_REMINDER_CRON:0 0 8 * * *}
app.jobs.weekly-summary.cron=${APP_JOBS_WEEKLY_SUMMARY_CRON:0 0 7 * * MON}
app.jobs.inactivity-reminder.cron=${APP_JOBS_INACTIVITY_REMINDER_CRON:0 0 9 * * *}
app.jobs.month-end-prediction.cron=${APP_JOBS_MONTH_END_PREDICTION_CRON:0 30 8 * * *}
