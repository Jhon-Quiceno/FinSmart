# Development-only overrides. Every connection/secret value stays sourced from environment
# variables via the base application.properties (see spring.datasource.*, app.jwt.*, etc.) -
# this profile only tunes local-dev ergonomics: verbose SQL logging and full Swagger exposure.

# Show generated SQL to ease debugging repository/query changes locally. Logged once via the
# org.hibernate.SQL logger below (not via spring.jpa.show-sql, which would print it a second
# time through Hibernate's own stdout printer). hibernate.format_sql still applies to the
# logger-based output, so pretty-printing is preserved.
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.smartfinance.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Full API docs/Swagger UI exposure for local exploration.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
