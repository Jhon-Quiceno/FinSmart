name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar cambios en smart-finance-mobile
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'smart-finance-mobile/**'

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-finance-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    defaults:
      run:
        working-directory: smart-finance-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: smart-finance-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  mobile-checks:
    name: mobile-checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    defaults:
      run:
        working-directory: smart-finance-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: smart-finance-mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile

      - name: Generar tipos de rutas de Expo Router
        run: pnpm exec expo customize tsconfig.json

      - name: Verificar tipos
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run mobile tests
        run: pnpm test
