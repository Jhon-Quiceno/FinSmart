name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "smart-finance-backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "smart-finance-backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Write Cloud Run env vars file
        run: |
          cat > /tmp/cloud-run-env-vars.yaml <<EOF
          SPRING_PROFILES_ACTIVE: "prod"
          SPRING_DATASOURCE_URL: "${{ secrets.SPRING_DATASOURCE_URL }}"
          SPRING_DATASOURCE_USERNAME: "${{ secrets.SPRING_DATASOURCE_USERNAME }}"
          SPRING_DATASOURCE_PASSWORD: "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          JWT_ISSUER: "smart-finance-backend"
          JWT_ACCESS_EXPIRATION_MS: "900000"
          JWT_REFRESH_EXPIRATION_MS: "604800000"
          JWT_REFRESH_COOKIE_NAME: "financeai_refresh_token"
          # The frontend proxies /api/* through its own origin (next.config.mjs
          # rewrite), so auth cookies are first-party and Lax is enough.
          JWT_REFRESH_COOKIE_SECURE: "true"
          JWT_REFRESH_COOKIE_SAME_SITE: "Lax"
          APP_CORS_ALLOWED_ORIGINS: "${{ secrets.APP_CORS_ALLOWED_ORIGINS }}"
          # Brevo SMTP (optional): with empty values the backend degrades to
          # in-app-only notifications (see EmailNotificationSender).
          BREVO_SMTP_LOGIN: "${{ secrets.BREVO_SMTP_LOGIN }}"
          BREVO_SMTP_KEY: "${{ secrets.BREVO_SMTP_KEY }}"
          MAIL_FROM: "${{ secrets.MAIL_FROM }}"
          EOF

      # On a PR: deploy a real revision (proves auth + build + deploy all work) but never
      # shift production traffic to it, so a PR can be validated safely before merging.
      - name: Deploy to Cloud Run (validate only, no traffic)
        if: github.event_name == 'pull_request'
        run: |
          gcloud run deploy finsmart-backend \
            --source ./smart-finance-backend \
            --region us-central1 \
            --memory 1Gi \
            --allow-unauthenticated \
            --no-traffic \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --env-vars-file=/tmp/cloud-run-env-vars.yaml

      - name: Deploy to Cloud Run (production)
        if: github.event_name == 'push'
        run: |
          gcloud run deploy finsmart-backend \
            --source ./smart-finance-backend \
            --region us-central1 \
            --memory 1Gi \
            --allow-unauthenticated \
            --env-vars-file=/tmp/cloud-run-env-vars.yaml

      # Once any deploy uses --no-traffic (the PR validation above), Cloud Run pins
      # traffic to a fixed revision instead of following LATEST, and later deploys
      # no longer shift traffic automatically. Force it back after every prod deploy.
      - name: Route traffic to latest revision
        if: github.event_name == 'push'
        run: |
          gcloud run services update-traffic finsmart-backend \
            --region us-central1 \
            --to-latest
