name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "smart-finance-backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Write Cloud Run env vars file
        run: |
          cat > /tmp/cloud-run-env-vars.yaml <<EOF
          SPRING_PROFILES_ACTIVE: "prod"
          SPRING_DATASOURCE_URL: "${{ secrets.SPRING_DATASOURCE_URL }}"
          SPRING_DATASOURCE_USERNAME: "${{ secrets.SPRING_DATASOURCE_USERNAME }}"
          SPRING_DATASOURCE_PASSWORD: "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          JWT_ISSUER: "smart-finance-backend"
          JWT_ACCESS_EXPIRATION_MS: "900000"
          JWT_REFRESH_EXPIRATION_MS: "604800000"
          JWT_REFRESH_COOKIE_NAME: "financeai_refresh_token"
          JWT_REFRESH_COOKIE_SECURE: "true"
          JWT_REFRESH_COOKIE_SAME_SITE: "None"
          APP_CORS_ALLOWED_ORIGINS: "${{ secrets.APP_CORS_ALLOWED_ORIGINS }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy finsmart-backend \
            --source ./smart-finance-backend \
            --region us-central1 \
            --memory 1Gi \
            --allow-unauthenticated \
            --env-vars-file=/tmp/cloud-run-env-vars.yaml
